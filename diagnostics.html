<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通信診断（履歴送信なし）</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:620px;margin:36px auto;padding:18px;color:#14243a;background:#f4f7fc}main{background:white;border-radius:18px;padding:24px}button{background:#1764b5;color:white;border:0;border-radius:12px;padding:17px;font-weight:bold;font-size:17px;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eff3f9;border-radius:8px;padding:14px}</style><main><h2>G検定・送信経路の通信診断</h2><p>学習履歴・パスワードを送信しない安全なテストです。GETと認証なしPOSTで、APIが正常なエラーを返すか確認します。</p><button id="run">通信診断を実行</button><pre id="out">未実行</pre></main><script>document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#out');out.textContent='通信診断中…';let results=[];for(const [name,opts] of [['GET',{method:'GET',cache:'no-store'}],['POST',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',cache:'no-store'}]]){try{const r=await fetch('/api/answer-sync',opts);let t=await r.text();results.push(name+': HTTP '+r.status+' / '+t.slice(0,180).replace(/[\r\n]/g,' '));}catch(e){results.push(name+': 通信エラー '+e.name+' / '+e.message)}}out.textContent=results.join('\n\n')+'\n\n期待値: GET 405、POST 401。どちらもデータ保存なし。';};</script></html>
